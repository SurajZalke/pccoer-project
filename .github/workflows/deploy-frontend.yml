name: Deploy Frontend to Netlify

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - '.env'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/deploy-frontend.yml'
  workflow_run:
    workflows: ["Deploy Backend to Render"]
    types: [completed]
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_MAINTENANCE_MODE: false
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_GROQ_API_KEY1: ${{ secrets.VITE_GROQ_API_KEY1 }}
          VITE_GROQ_API_KEY2: ${{ secrets.VITE_GROQ_API_KEY2 }}
          VITE_GROQ_API_KEY3: ${{ secrets.VITE_GROQ_API_KEY3 }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY2: ${{ secrets.VITE_GEMINI_API_KEY2 }}
          VITE_GEMINI_API_KEY3: ${{ secrets.VITE_GEMINI_API_KEY3 }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
          VITE_CLOUDINARY_CLOUD_NAME1: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME1 }}
          VITE_CLOUDINARY_UPLOAD_PRESET1: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET1 }}
          VITE_CLOUDINARY_CLOUD_NAME2: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME2 }}
          VITE_CLOUDINARY_UPLOAD_PRESET2: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET2 }}
          VITE_CLOUDINARY_CLOUD_NAME3: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME3 }}
          VITE_CLOUDINARY_UPLOAD_PRESET3: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET3 }}
          VITE_CLOUDINARY_CLOUD_NAME4: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME4 }}
          VITE_CLOUDINARY_UPLOAD_PRESET4: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET4 }}

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v2.0
        with:
          publish-dir: './dist'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Deploy from GitHub Actions'
          enable-pull-request-comment: true
          enable-commit-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 10
