name: Keep Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -s -X GET https://dhole-sir-backend.onrender.com/health || true
        timeout-minutes: 2
