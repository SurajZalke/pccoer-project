# Render.com deployment configuration
# Backend: Node.js web service running from ./backend/

services:
  - type: web
    name: dhole-sir-coaching-classes
    runtime: node
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps
    startCommand: node server.js
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: FIREBASE_DATABASE_URL
        value: https://mspcollage-advance-2612-default-rtdb.firebaseio.com
      - key: FIREBASE_STORAGE_BUCKET
        value: mspcollage-advance-2612.appspot.com
      - key: FRONTEND_URL
        value: https://vivekdhole-sir.netlify.app
      - key: ADMIN_UID
        value: Ch0V3K1ELxPZyZiC439DrCeAjnM2
      # Set these as secret env vars in Render dashboard (never commit real values):
      # FIREBASE_PROJECT_ID
      # FIREBASE_CLIENT_EMAIL
      # FIREBASE_PRIVATE_KEY
      # ADMIN_SECRET
      # EMAIL_USER
      # EMAIL_PASSWORD
      # OWNER_EMAIL
      # JWT_SECRET
      # TOKEN_EXPIRY
