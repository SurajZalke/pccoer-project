# Render.com deployment (free tier, no credit card)
# Deploy: connect GitHub repo at render.com → New Web Service → select repo

services:
  - type: web
    name: dhole-sir-coaching-classes
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: FIREBASE_DATABASE_URL
        value: https://mspcollage-advance-2612-default-rtdb.firebaseio.com
      - key: FIREBASE_STORAGE_BUCKET
        value: mspcollage-advance-2612.appspot.com
      - key: FRONTEND_URL
        value: https://vivekdhole-sir.netlify.app
      # Backend URL: https://dhole-sir-coaching-classes-iqpg.onrender.com
      - key: ADMIN_UID
        value: Ch0V3K1ELxPZyZiC439DrCeAjnM2
      # Set these as secret env vars in Render dashboard (never commit real values):
      # FIREBASE_PROJECT_ID
      # FIREBASE_CLIENT_EMAIL
      # FIREBASE_PRIVATE_KEY
      # ADMIN_SECRET
      # EMAIL_USER
      # EMAIL_PASSWORD       (Gmail App Password, NOT your normal password)
      # OWNER_EMAIL
      # JWT_SECRET           (long random string)
      # TOKEN_EXPIRY         (e.g. 24h)
